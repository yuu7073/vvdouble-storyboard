<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VV DOUBLE 分鏡規劃</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  background: #faf8f5;
  color: #2c2c2a;
  line-height: 1.6;
  min-height: 100vh;
}

/* ========== 登入畫面 ========== */
.login-screen, .user-picker-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.login-box {
  background: #fff;
  border: 1px solid #e8e4dc;
  border-radius: 16px;
  padding: 40px 32px;
  width: 380px;
  max-width: 100%;
  text-align: center;
}
.login-box h1 {
  font-size: 22px;
  font-weight: 500;
  margin-bottom: 8px;
}
.login-box .subtitle {
  font-size: 13px;
  color: #888780;
  margin-bottom: 28px;
}
.login-box input[type="password"],
.login-box input[type="text"] {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid #d3d1c7;
  border-radius: 8px;
  font-size: 15px;
  margin-bottom: 12px;
  font-family: inherit;
}
.login-box button.primary {
  width: 100%;
  padding: 12px;
  border: none;
  background: #2c2c2a;
  color: #fff;
  border-radius: 8px;
  font-size: 15px;
  cursor: pointer;
  font-family: inherit;
}
.login-box button.primary:hover { background: #444441; }
.login-box .err {
  color: #a32d2d;
  font-size: 13px;
  margin-top: 8px;
  min-height: 18px;
}

/* 成員選擇格子 */
.user-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 8px;
}
.user-pick-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 16px 8px;
  background: #fff;
  border: 1px solid #d3d1c7;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
}
.user-pick-btn:hover { background: #faf8f5; border-color: #888780; }
.avatar {
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 500;
  flex-shrink: 0;
}
.avatar-lg { width: 48px; height: 48px; font-size: 18px; }
.avatar-md { width: 36px; height: 36px; font-size: 14px; }
.avatar-sm { width: 24px; height: 24px; font-size: 11px; }
.avatar-xs { width: 22px; height: 22px; font-size: 11px; }
.no-member-hint {
  font-size: 13px;
  color: #888780;
  text-align: center;
  padding: 20px 0;
}
.link-btn {
  background: transparent;
  border: none;
  color: #5f5e5a;
  font-size: 12px;
  cursor: pointer;
  padding: 8px;
  font-family: inherit;
  margin-top: 12px;
  text-decoration: underline;
}

/* ========== 主畫面通用 ========== */
.app { max-width: 1280px; margin: 0 auto; padding: 24px 20px 60px; }

/* Header */
.header {
  background: #fff;
  border: 1px solid #e8e4dc;
  border-radius: 12px;
  padding: 18px 22px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.header-left h1 {
  font-size: 20px;
  font-weight: 500;
  margin-bottom: 4px;
}
.header-left .meta {
  font-size: 13px;
  color: #888780;
}
.header-right {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

/* 按鈕 */
.btn {
  padding: 8px 14px;
  border: 1px solid #d3d1c7;
  border-radius: 8px;
  background: #fff;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  color: #2c2c2a;
  transition: all 0.15s;
}
.btn:hover { background: #f5f2ec; border-color: #888780; }
.btn-primary {
  background: #2c2c2a;
  color: #fff;
  border-color: #2c2c2a;
}
.btn-primary:hover { background: #444441; color: #fff; }
.btn-danger {
  color: #a32d2d;
  border-color: #f0baba;
}
.btn-danger:hover { background: #fceaea; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-icon {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

/* 當前使用者按鈕 */
.current-user-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px 6px 6px;
  background: #fff;
  border: 1px solid #d3d1c7;
  border-radius: 24px;
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
}
.current-user-btn:hover { background: #f5f2ec; }

/* ========== 專案列表頁 ========== */
.filter-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  align-items: center;
}
.filter-bar .label {
  font-size: 13px;
  color: #888780;
}
.filter-chip {
  padding: 6px 12px;
  border-radius: 20px;
  background: #fff;
  border: 1px solid #d3d1c7;
  font-size: 12px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: inherit;
}
.filter-chip:hover { background: #f5f2ec; }
.filter-chip.active {
  background: #e6f1fb;
  color: #0c447c;
  border-color: #b5d4f4;
}
.filter-chip .chip-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
}
.filter-bar input.search {
  width: 200px;
  padding: 6px 12px;
  border: 1px solid #d3d1c7;
  border-radius: 8px;
  font-size: 13px;
  font-family: inherit;
}

.projects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
}
.project-card {
  background: #fff;
  border: 1px solid #e8e4dc;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.15s;
}
.project-card:hover {
  border-color: #888780;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  transform: translateY(-1px);
}
.project-thumb {
  aspect-ratio: 16 / 10;
  background: #1a1a1a;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.project-thumb .ratio-frame {
  background: #2a2a2a;
  border-radius: 4px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.project-thumb .ratio-frame video,
.project-thumb .ratio-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.ratio-9-16 { aspect-ratio: 9/16; height: 80%; }
.ratio-16-9 { aspect-ratio: 16/9; width: 80%; }
.ratio-1-1 { aspect-ratio: 1/1; height: 75%; }
.ratio-4-3 { aspect-ratio: 4/3; width: 75%; }
.thumb-empty-icon {
  color: #5f5e5a;
  font-size: 24px;
}
.ratio-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 4px;
}
.maker-badge {
  position: absolute;
  bottom: 8px;
  right: 8px;
  border: 2px solid #1a1a1a;
}
.project-info { padding: 12px 14px; }
.project-info .name {
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 4px;
  word-break: break-word;
}
.project-info .meta {
  font-size: 12px;
  color: #888780;
}
.project-status-tags {
  display: flex;
  gap: 4px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.status-tag {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
}
.status-todo-bg { background: #faeeda; color: #854f0b; }
.status-shot-bg { background: #e1f5ee; color: #085041; }
.status-ok-bg { background: #e6f1fb; color: #0c447c; }
.status-redo-bg { background: #fcebeb; color: #791f1f; }

.add-project-card {
  background: transparent;
  border: 1.5px dashed #d3d1c7;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 240px;
  cursor: pointer;
  transition: all 0.15s;
}
.add-project-card:hover { border-color: #888780; background: #fafaf7; }
.add-project-card .inner {
  text-align: center;
  color: #888780;
}
.add-project-card .inner .plus {
  font-size: 32px;
  display: block;
  margin-bottom: 4px;
}
.add-project-card .inner .text { font-size: 13px; }

/* 空狀態 */
.empty-state {
  background: #fff;
  border: 1px dashed #d3d1c7;
  border-radius: 12px;
  padding: 60px 20px;
  text-align: center;
  color: #888780;
}
.empty-state h3 {
  font-size: 16px;
  font-weight: 500;
  color: #2c2c2a;
  margin-bottom: 8px;
}
.empty-state p { font-size: 13px; margin-bottom: 16px; }

/* ========== 分鏡頁 ========== */
.back-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.back-bar .btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.mode-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  align-items: center;
  flex-wrap: wrap;
}
.mode-bar .label {
  font-size: 13px;
  color: #888780;
  margin-right: 4px;
}
.mode-btn {
  padding: 8px 16px;
  border: 1px solid #d3d1c7;
  border-radius: 8px;
  background: #fff;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
}
.mode-btn.active {
  background: #2c2c2a;
  color: #fff;
  border-color: #2c2c2a;
}
.mode-bar .spacer { flex: 1; }

/* 分鏡格子 */
.shots-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
}
.shot-card {
  background: #fff;
  border: 1px solid #e8e4dc;
  border-radius: 12px;
  padding: 12px;
  cursor: grab;
  transition: all 0.15s;
  position: relative;
}
.shot-card:hover {
  border-color: #888780;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.shot-card.dragging { opacity: 0.4; cursor: grabbing; }
.shot-card.drag-over { border-color: #185fa5; border-style: dashed; }
.shot-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.shot-num { font-size: 12px; font-weight: 500; color: #888780; }
.shot-status {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 6px;
  font-weight: 500;
}
.shot-media {
  background: #f1efe8;
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  cursor: pointer;
}
.shot-media.empty {
  flex-direction: column;
  gap: 6px;
  color: #b4b2a9;
}
.shot-media video, .shot-media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.duration-badge {
  position: absolute;
  bottom: 6px;
  right: 6px;
  background: rgba(0,0,0,0.65);
  color: #fff;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
}
.play-icon {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 36px;
  height: 36px;
  background: rgba(0,0,0,0.5);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
}
.shot-media:hover .play-icon { opacity: 1; }
.play-icon svg { fill: #fff; }
.shot-title {
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 4px;
  word-break: break-word;
}
.shot-note {
  font-size: 12px;
  color: #5f5e5a;
  line-height: 1.5;
  word-break: break-word;
  white-space: pre-wrap;
}
.add-shot-card {
  background: transparent;
  border: 1.5px dashed #d3d1c7;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  min-height: 240px;
  transition: all 0.15s;
}
.add-shot-card:hover { border-color: #888780; background: #fafaf7; }
.add-shot-card .inner {
  text-align: center;
  color: #888780;
  font-size: 13px;
}
.add-shot-card .inner .plus {
  font-size: 24px;
  display: block;
  margin-bottom: 4px;
}

.status-todo { background: #faeeda; color: #854f0b; }
.status-shot { background: #e1f5ee; color: #085041; }
.status-ok { background: #e6f1fb; color: #0c447c; }
.status-redo { background: #fcebeb; color: #791f1f; }

/* Reels 模式 */
.reels-stage {
  background: #f1efe8;
  border-radius: 16px;
  padding: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  flex-wrap: wrap;
  min-height: 540px;
}
.reels-side {
  width: 90px;
  opacity: 0.4;
  cursor: pointer;
  text-align: center;
}
.reels-side .thumb {
  background: #fff;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  margin-bottom: 6px;
}
.reels-side .thumb video, .reels-side .thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.reels-side .label-num { font-size: 11px; color: #888780; }
.reels-main {
  width: 280px;
  max-width: 90vw;
}
.reels-frame {
  background: #1a1a1a;
  border-radius: 28px;
  padding: 8px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.15);
}
.reels-screen {
  background: #2a2a2a;
  border-radius: 22px;
  position: relative;
  overflow: hidden;
}
.reels-screen video, .reels-screen img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}
.reels-overlay {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 14px;
  pointer-events: none;
}
.reels-top, .reels-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.reels-pill {
  background: rgba(0,0,0,0.5);
  color: #fff;
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 12px;
  font-weight: 500;
  backdrop-filter: blur(8px);
}
.reels-bottom-text {
  color: #fff;
  text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  width: 100%;
}
.reels-bottom-text .t-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
.reels-bottom-text .t-note { font-size: 12px; opacity: 0.92; line-height: 1.5; white-space: pre-wrap; }
.reels-empty {
  color: #888;
  font-size: 13px;
  text-align: center;
  width: 100%;
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.reels-progress {
  display: flex;
  gap: 4px;
  justify-content: center;
  margin-top: 14px;
  flex-wrap: wrap;
}
.reels-progress .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #b4b2a9;
  cursor: pointer;
  transition: all 0.2s;
}
.reels-progress .dot.active {
  width: 22px;
  border-radius: 3px;
  background: #2c2c2a;
}
.reels-info {
  background: #fff;
  border: 1px solid #e8e4dc;
  border-radius: 12px;
  padding: 16px 20px;
  margin-top: 16px;
}
.reels-info .info-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  flex-wrap: wrap;
  gap: 8px;
}
.reels-info .info-title { font-size: 15px; font-weight: 500; }
.reels-info .info-note {
  font-size: 13px;
  color: #5f5e5a;
  line-height: 1.7;
  white-space: pre-wrap;
}

/* ========== Modal ========== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: #fff;
  border-radius: 16px;
  width: 480px;
  max-width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 28px;
}
.modal-box h2 { font-size: 18px; font-weight: 500; margin-bottom: 4px; }
.modal-box .modal-sub { font-size: 13px; color: #888780; margin-bottom: 20px; }
.modal-box label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: #2c2c2a;
  margin-bottom: 6px;
  margin-top: 16px;
}
.modal-box label:first-of-type { margin-top: 0; }
.modal-box input[type="text"],
.modal-box textarea,
.modal-box select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #d3d1c7;
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  resize: vertical;
}
.modal-box textarea { min-height: 100px; }
.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 24px;
  flex-wrap: wrap;
}

/* 比例選擇 */
.ratio-picker {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.ratio-option {
  border: 1px solid #d3d1c7;
  border-radius: 8px;
  padding: 12px 4px;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
}
.ratio-option:hover { border-color: #888780; }
.ratio-option.selected {
  border-color: #185fa5;
  border-width: 2px;
  background: #e6f1fb;
}
.ratio-option .ratio-shape { background: #888780; margin: 0 auto 8px; border-radius: 3px; }
.ratio-option.selected .ratio-shape { background: #185fa5; }
.ratio-option .ratio-label { font-size: 12px; font-weight: 500; margin-bottom: 2px; }
.ratio-option .ratio-platform { font-size: 10px; color: #888780; }
.ratio-option.selected .ratio-platform { color: #185fa5; }

/* 上傳區 */
.upload-area {
  display: block;
  border: 2px dashed #185fa5;
  border-radius: 8px;
  padding: 24px;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
  background: #f0f7ff;
  user-select: none;
}
.upload-area:hover { border-color: #0c447c; background: #e6f1fb; }
.upload-area:active { transform: scale(0.99); }
.upload-area .upload-text {
  font-size: 14px;
  color: #185fa5;
  font-weight: 500;
  margin-bottom: 4px;
}
.upload-area .upload-hint { font-size: 11px; color: #888780; }
.upload-progress { margin-top: 12px; font-size: 12px; color: #5f5e5a; }
.preview-area {
  margin-top: 12px;
  position: relative;
  border-radius: 8px;
  overflow: hidden;
  background: #f1efe8;
}
.preview-area video, .preview-area img {
  width: 100%;
  display: block;
  max-height: 300px;
  object-fit: contain;
}
.preview-clear {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  border: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 14px;
}

/* 狀態選擇 */
.status-picker { display: flex; gap: 6px; flex-wrap: wrap; }
.status-option {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.15s;
}
.status-option.todo { background: #faeeda; color: #854f0b; }
.status-option.shot { background: #e1f5ee; color: #085041; }
.status-option.ok { background: #e6f1fb; color: #0c447c; }
.status-option.redo { background: #fcebeb; color: #791f1f; }

/* 成員管理 */

.color-palette {

/* 唯讀模式 */

<body>

<!-- ===== 登入畫面 ===== -->
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h1>VV DOUBLE 分鏡規劃</h1>

<!-- ===== 選擇身份畫面 ===== -->
<div id="userPickerScreen" class="user-picker-screen" style="display:none;">
  <div class="login-box">

<!-- ===== 主畫面 ===== -->
<div id="mainApp" class="app" style="display:none;">

  <div id="readonlyBanner" class="readonly-banner" style="display:none;">

  </div>

  <!-- 內容區（依路由切換） -->
  <div id="appContent"></div>
</div>

<!-- ===== 新專案 Modal ===== -->
<div class="modal-overlay" id="newProjectModal">
  <div class="modal-box">
    <h2>建立新專案</h2>
    <p class="modal-sub">選擇影片比例後，整個專案的所有分鏡會用同一比例顯示</p>

    <label>專案名稱</label>
    <input type="text" id="newProjectName" placeholder="例如：VV × 婉滋 Reels">

    <label>影片比例</label>

      <div class="ratio-option selected" data-ratio="9:16">

        <div class="ratio-platform">YouTube</div>
      </div>
      <div class="ratio-option" data-ratio="1:1">
        <div class="ratio-shape" style="width:28px; height:28px; margin-top:2px;"></div>

      <div class="ratio-option" data-ratio="4:3">
        <div class="ratio-shape" style="width:32px; height:24px; margin-top:4px;"></div>

<!-- ===== 分鏡編輯 Modal ===== -->
<div class="modal-overlay" id="shotModal">
  <div class="modal-box">
    <h2 id="shotModalTitle">新增分鏡</h2>
    <p class="modal-sub" id="shotModalSub">填寫分鏡資訊</p>

    <label>標題</label>
    <input type="text" id="shotTitle" placeholder="例如：刺繡牛仔外套近拍">

    <label>影片或參考圖</label>
    <label class="upload-area" id="uploadArea" for="fileInput">
      <div class="upload-text">📁 點此上傳影片或圖片</div>

    <div class="status-picker" id="statusPicker">

      <div class="status-option shot" data-status="shot">已拍</div>

      <button class="btn" data-close-modal="shotModal">取消</button>

</div>

<!-- ===== 媒體放大檢視 Modal ===== -->
<div class="modal-overlay" id="viewerModal">
  <div class="modal-box" style="background: transparent; padding: 0; max-width: 90vw; width: auto;">
    <div id="viewerContent" style="position: relative;"></div>
    <div style="text-align: center; margin-top: 12px;">
      <button class="btn" data-close-modal="viewerModal" style="background: rgba(255,255,255,0.9);">關閉</button>

</div>

<!-- ===== 管理成員 Modal ===== -->
<div class="modal-overlay" id="manageMembersModal">
  <div class="modal-box">
    <h2>管理成員</h2>
    <p class="modal-sub">新增、編輯或刪除製作者</p>

      <button class="btn btn-primary" id="addMemberBtn" style="width: 100%;">+ 新增成員</button>

    <div class="modal-actions">
      <button class="btn" data-close-modal="manageMembersModal">關閉</button>
    </div>

</div>

<!-- ===== 刪除成員處理 Modal ===== -->

  <div class="modal-box">

    <p class="modal-sub" id="deleteMemberSub">他建立過的專案要怎麼處理？</p>

    <div class="modal-actions">

      <button class="btn btn-danger" id="confirmDeleteMemberBtn">確認刪除</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ============================================================
 * VV DOUBLE 分鏡規劃工具 v2
 * 新增：專案列表頁、成員管理、製作者標記、網址路由
 * ============================================================ */

// ========== Firebase 設定 ==========
const firebaseConfig = {
  apiKey: "AIzaSyDFP_pu6oWSFdKWF64J-0PDQCujRKlqiNs",
  authDomain: "vvdouble-storyboard.firebaseapp.com",
  databaseURL: "https://vvdouble-storyboard-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "vvdouble-storyboard",
  storageBucket: "vvdouble-storyboard.firebasestorage.app",
  messagingSenderId: "505264128604",
  appId: "1:505264128604:web:ace4b7eaf550ddc9e3dc99"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const storage = firebase.storage();

// ========== 設定 ==========
const PASSWORD = 'vvdoubles2';
const MAX_VIDEO_SIZE = 100 * 1024 * 1024; // 100MB
const MAX_IMAGE_SIZE = 10 * 1024 * 1024;  // 10MB

// 預設成員顏色（背景, 文字, 名稱）
const MEMBER_COLORS = [
  { id: 'yellow', bg: '#FDE68A', fg: '#854F0B', name: '黃' },
  { id: 'blue',   bg: '#BFDBFE', fg: '#0C447C', name: '藍' },
  { id: 'pink',   bg: '#FBCFE8', fg: '#72243E', name: '粉' },
  { id: 'green',  bg: '#BBF7D0', fg: '#085041', name: '綠' },
  { id: 'purple', bg: '#DDD6FE', fg: '#3C3489', name: '紫' },
  { id: 'orange', bg: '#FED7AA', fg: '#854F0B', name: '橘' },
  { id: 'red',    bg: '#FECACA', fg: '#791F1F', name: '紅' },
  { id: 'gray',   bg: '#D3D1C7', fg: '#444441', name: '灰' },
];

// ========== 全域狀態 ==========
let currentProjectId = null;
let currentMemberId = null;
let projects = {};
let members = {};
let currentMode = 'grid';
let currentReelIndex = 0;
let isReadonly = false;
let editingShotId = null;
let pendingMediaData = null;
let selectedNewMemberColor = 'yellow';
let editingMemberId = null;
let pendingDeleteMemberId = null;
let filterMakerId = 'all'; // 'all' | 'mine' | memberId
let searchQuery = '';

// ========== 工具函數 ==========
function $(id) { return document.getElementById(id); }
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function ratioToCss(ratio) { return ratio.replace(':', ' / '); }
function statusLabel(s) {
  return { todo:'待拍', shot:'已拍', ok:'確認 OK', redo:'重拍' }[s] || '待拍';
}
function getQueryParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}
function getColor(colorId) {
  return MEMBER_COLORS.find(c => c.id === colorId) || MEMBER_COLORS[0];
}
function getFirstChar(name) {
  if (!name) return '?';
  return name.trim().charAt(0);
}
function timeAgo(ts) {
  if (!ts) return '';
  const diff = Date.now() - ts;
  const min = Math.floor(diff / 60000);
  if (min < 1) return '剛剛';
  if (min < 60) return `${min} 分鐘前`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr} 小時前`;
  const day = Math.floor(hr / 24);
  if (day < 30) return `${day} 天前`;
  const mon = Math.floor(day / 30);
  if (mon < 12) return `${mon} 個月前`;
  return `${Math.floor(mon / 12)} 年前`;
}

// 渲染頭像 HTML
function avatarHtml(memberId, sizeClass) {
  const m = members[memberId];
  if (!m) {
    return `<div class="avatar ${sizeClass}" style="background:#e8e4dc; color:#888780;">?</div>`;
  }
  const c = getColor(m.color);
  return `<div class="avatar ${sizeClass}" style="background:${c.bg}; color:${c.fg};">${escapeHtml(getFirstChar(m.name))}</div>`;
}

// ========== 進入點 ==========
function init() {
  const sharedProject = getQueryParam('p');
  const view = getQueryParam('view');

  if (sharedProject && view === 'readonly') {
    isReadonly = true;
    $('loginScreen').style.display = 'none';
    $('mainApp').style.display = 'block';
    $('readonlyBanner').style.display = 'block';
    currentProjectId = sharedProject;
    loadMembersAndProjects();
    return;
  }

  if (sessionStorage.getItem('storyboard_logged_in') === 'true') {
    afterLogin();
  } else {
    showLogin();
  }
}

function showLogin() {
  $('loginScreen').style.display = 'flex';
  $('userPickerScreen').style.display = 'none';
  $('mainApp').style.display = 'none';
  $('loginPwd').focus();
}

function afterLogin() {
  $('loginScreen').style.display = 'none';
  const savedMemberId = localStorage.getItem('storyboard_current_member');
  loadMembersAndProjects(() => {
    if (savedMemberId && members[savedMemberId]) {
      currentMemberId = savedMemberId;
      enterApp();
    } else {
      showUserPicker();
    }
  });
}

function showUserPicker() {
  $('userPickerScreen').style.display = 'flex';
  $('mainApp').style.display = 'none';
  renderUserPicker();
}

function enterApp() {
  $('userPickerScreen').style.display = 'none';
  $('mainApp').style.display = 'block';
  handleRouteChange();
}

// ========== 登入 ==========
$('loginBtn').addEventListener('click', tryLogin);
$('loginPwd').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') tryLogin();
});
function tryLogin() {
  const v = $('loginPwd').value;
  if (v === PASSWORD) {
    sessionStorage.setItem('storyboard_logged_in', 'true');
    afterLogin();
  } else {
    $('loginErr').textContent = '密碼錯誤';
    $('loginPwd').value = '';
  }
}

// ========== 載入資料 ==========
function loadMembersAndProjects(onFirstLoad) {
  let firstLoaded = false;
  let dataReady = { members: false, projects: false };

  function checkAndCall() {
    if (dataReady.members && dataReady.projects && !firstLoaded) {
      firstLoaded = true;
      if (onFirstLoad) onFirstLoad();
    }
  }

  db.ref('/members').on('value', (snap) => {
    members = snap.val() || {};
    dataReady.members = true;
    checkAndCall();
    if (firstLoaded) reRender();
  });

  db.ref('/projects').on('value', (snap) => {
    projects = snap.val() || {};
    dataReady.projects = true;
    checkAndCall();
    if (firstLoaded) reRender();
  });
}

function reRender() {
  if (isReadonly) {
    renderShotPage();
    return;
  }
  if (currentProjectId) {
    renderShotPage();
  } else {
    renderProjectListPage();
  }
}

// ========== 路由 ==========
function handleRouteChange() {
  const p = getQueryParam('p');
  if (p && projects[p]) {
    currentProjectId = p;
    currentReelIndex = 0;
  } else {
    currentProjectId = null;
  }
  reRender();
}

function navigateToProject(projectId) {
  currentProjectId = projectId;
  currentReelIndex = 0;
  // 更新網址（不重新載入頁面）
  const newUrl = `${window.location.pathname}?p=${projectId}`;
  window.history.pushState({ p: projectId }, '', newUrl);
  reRender();
}

function navigateToList() {
  currentProjectId = null;
  window.history.pushState({}, '', window.location.pathname);
  reRender();
}

window.addEventListener('popstate', () => {
  if (isReadonly) return; // 唯讀模式不處理路由
  handleRouteChange();
});

// ========== 選擇身份 ==========
function renderUserPicker() {
  const grid = $('userGrid');
  const memberList = Object.entries(members);

  if (memberList.length === 0) {
    grid.innerHTML = `
      <div class="no-member-hint" style="grid-column: 1/-1;">
        還沒有成員，請先點下方「管理成員」新增第一位
      </div>
    `;
    return;
  }

  grid.innerHTML = memberList.map(([id, m]) => {
    const c = getColor(m.color);
    return `
      <button class="user-pick-btn" data-pick-member="${id}">
        <div class="avatar avatar-lg" style="background:${c.bg}; color:${c.fg};">${escapeHtml(getFirstChar(m.name))}</div>
        <span style="font-size:13px; font-weight:500;">${escapeHtml(m.name)}</span>
      </button>
    `;
  }).join('');

  grid.querySelectorAll('[data-pick-member]').forEach(btn => {
    btn.addEventListener('click', () => {
      const mid = btn.dataset.pickMember;
      currentMemberId = mid;
      localStorage.setItem('storyboard_current_member', mid);
      enterApp();
    });
  });
}

$('openManageMembersBtn').addEventListener('click', () => {
  openManageMembersModal();
});

// ========== 專案列表頁 ==========
function renderProjectListPage() {
  const allProjects = Object.entries(projects).map(([id, p]) => ({ id, ...p }));

  // 篩選
  let filtered = allProjects;
  if (filterMakerId === 'mine') {
    filtered = filtered.filter(p => p.createdBy === currentMemberId);
  } else if (filterMakerId !== 'all') {
    filtered = filtered.filter(p => p.createdBy === filterMakerId);
  }
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(p => (p.name || '').toLowerCase().includes(q));
  }

  // 排序：最後更新時間
  filtered.sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));

  const me = members[currentMemberId];

  let html = `
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <h1>VV DOUBLE 分鏡規劃</h1>
        <div class="meta">共 ${allProjects.length} 個專案</div>
      </div>
      <div class="header-right">
        <button class="current-user-btn" id="switchUserBtn" title="點擊切換身份">
          ${avatarHtml(currentMemberId, 'avatar-xs')}
          <span>${me ? escapeHtml(me.name) : '訪客'}</span>
          <span style="font-size:10px; color:#888780;">▾</span>
        </button>
        <button class="btn btn-primary" id="newProjectBtn">+ 新專案</button>
      </div>
    </div>

    <!-- 篩選列 -->
    <div class="filter-bar">
      <span class="label">篩選：</span>
      <button class="filter-chip ${filterMakerId === 'all' ? 'active' : ''}" data-filter="all">全部</button>
      <button class="filter-chip ${filterMakerId === 'mine' ? 'active' : ''}" data-filter="mine">
        ${me ? `<span class="chip-dot" style="background:${getColor(me.color).bg};"></span> 只看我的` : '只看我的'}
      </button>
      ${Object.entries(members)
        .filter(([id]) => id !== currentMemberId)
        .map(([id, m]) => {
          const c = getColor(m.color);
          return `<button class="filter-chip ${filterMakerId === id ? 'active' : ''}" data-filter="${id}">
            <span class="chip-dot" style="background:${c.bg};"></span> ${escapeHtml(m.name)}
          </button>`;
        }).join('')}
      <div style="flex:1;"></div>
      <input type="text" class="search" id="searchInput" placeholder="搜尋專案名稱…" value="${escapeHtml(searchQuery)}">
    </div>
  `;

  if (filtered.length === 0 && searchQuery === '' && filterMakerId === 'all') {
    html += `
      <div class="empty-state">
        <h3>還沒有任何分鏡專案</h3>
        <p>建立第一個專案，開始規劃你的拍攝內容</p>
        <button class="btn btn-primary" onclick="document.getElementById('newProjectBtn').click()">+ 建立新專案</button>
      </div>
    `;
  } else if (filtered.length === 0) {
    html += `
      <div class="empty-state">
        <h3>沒有符合條件的專案</h3>
        <p>試試別的篩選條件</p>
      </div>
    `;
  } else {
    html += '<div class="projects-grid">';
    filtered.forEach(p => {
      html += renderProjectCard(p);
    });
    html += `
      <div class="add-project-card" id="addProjectCard">
        <div class="inner">
          <span class="plus">+</span>
          <span class="text">建立新專案</span>
        </div>
      </div>
    </div>`;
  }

  $('appContent').innerHTML = html;
  attachListPageEvents();
}

function renderProjectCard(p) {
  const shots = p.shots ? Object.values(p.shots) : [];
  const shotCount = shots.length;
  const ratioClass = 'ratio-' + p.ratio.replace(':', '-');

  // 找第一張有媒體的分鏡當縮圖
  const sortedShots = shots.sort((a, b) => (a.order || 0) - (b.order || 0));
  const firstWithMedia = sortedShots.find(s => s.mediaUrl);

  let thumbInner;
  if (firstWithMedia) {
    if (firstWithMedia.mediaType === 'video') {
      thumbInner = `<video src="${escapeHtml(firstWithMedia.mediaUrl)}" muted preload="metadata"></video>`;
    } else {
      thumbInner = `<img src="${escapeHtml(firstWithMedia.mediaUrl)}" alt="">`;
    }
  } else {
    thumbInner = `<div class="thumb-empty-icon">▶</div>`;
  }

  // 狀態統計
  const statusCount = { todo: 0, shot: 0, ok: 0, redo: 0 };
  shots.forEach(s => {
    if (statusCount[s.status] != null) statusCount[s.status]++;
  });
  let statusTags = '';
  if (statusCount.ok > 0) statusTags += `<span class="status-tag status-ok-bg">OK ${statusCount.ok}</span>`;
  if (statusCount.shot > 0) statusTags += `<span class="status-tag status-shot-bg">已拍 ${statusCount.shot}</span>`;
  if (statusCount.todo > 0) statusTags += `<span class="status-tag status-todo-bg">待拍 ${statusCount.todo}</span>`;
  if (statusCount.redo > 0) statusTags += `<span class="status-tag status-redo-bg">重拍 ${statusCount.redo}</span>`;

  // 製作者
  const maker = p.createdBy ? members[p.createdBy] : null;
  const makerName = maker ? maker.name : '無';
  const updateTime = timeAgo(p.updatedAt || p.createdAt);

  return `
    <div class="project-card" data-project-id="${p.id}">
      <div class="project-thumb">
        <div class="ratio-frame ${ratioClass}">${thumbInner}</div>
        <span class="ratio-badge">${p.ratio}</span>
        ${p.createdBy ? `<div class="maker-badge">${avatarHtml(p.createdBy, 'avatar-sm')}</div>` : ''}
      </div>
      <div class="project-info">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="meta">${shotCount} 個分鏡 · ${escapeHtml(makerName)} · ${updateTime}</div>
        ${statusTags ? `<div class="project-status-tags">${statusTags}</div>` : ''}
      </div>
    </div>
  `;
}

function getSortedShots() {
  const p = projects[currentProjectId];
  if (!p || !p.shots) return [];
  return Object.entries(p.shots)
    .map(([id, s]) => ({ id, ...s }))
    .sort((a, b) => (a.order || 0) - (b.order || 0));
}

function renderShotGrid() {
  const p = projects[currentProjectId];
  const shots = getSortedShots();
  const ratioCss = ratioToCss(p.ratio);

  let html = '<div class="shots-grid">';

  shots.forEach((s, idx) => {
    const num = String(idx + 1).padStart(2, '0');
    const statusClass = 'status-' + (s.status || 'todo');

    let mediaHtml = '';
    if (s.mediaUrl) {
      if (s.mediaType === 'video') {
        const dur = s.duration ? `<span class="duration-badge">${formatDuration(s.duration)}</span>` : '';
        mediaHtml = `
          <div class="shot-media" style="aspect-ratio: ${ratioCss};" data-action="view-media" data-shot-id="${s.id}">
            <video src="${escapeHtml(s.mediaUrl)}" muted preload="metadata"></video>
            <div class="play-icon"><svg width="14" height="14" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
            ${dur}
          </div>`;
      } else {
        mediaHtml = `
          <div class="shot-media" style="aspect-ratio: ${ratioCss};" data-action="view-media" data-shot-id="${s.id}">
            <img src="${escapeHtml(s.mediaUrl)}" alt="">
          </div>`;
      }
    } else {
      mediaHtml = `
        <div class="shot-media empty" style="aspect-ratio: ${ratioCss};">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2"/>

function attachGridEvents() {
  document.querySelectorAll('.shot-card').forEach(card => {
    card.addEventListener('click', (e) => {
      const mediaEl = e.target.closest('[data-action="view-media"]');
      if (mediaEl) {
        e.stopPropagation();
        viewMedia(mediaEl.dataset.shotId);
        return;
      }
      if (!isReadonly) openShotModal(card.dataset.shotId);
    });

    if (!isReadonly) attachDragEvents(card);
  });

  const addCard = $('addShotCard');
  if (addCard) addCard.addEventListener('click', () => openShotModal());
}

function attachDragEvents(card) {
  card.addEventListener('dragstart', (e) => {
    card.classList.add('dragging');
    e.dataTransfer.setData('text/plain', card.dataset.shotId);
    e.dataTransfer.effectAllowed = 'move';
  });
  card.addEventListener('dragend', () => {
    card.classList.remove('dragging');
    document.querySelectorAll('.shot-card').forEach(c => c.classList.remove('drag-over'));
  });
  card.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    card.classList.add('drag-over');
  });
  card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
  card.addEventListener('drop', (e) => {
    e.preventDefault();
    card.classList.remove('drag-over');
    const draggedId = e.dataTransfer.getData('text/plain');
    const targetId = card.dataset.shotId;
    if (draggedId && draggedId !== targetId) {
      reorderShots(draggedId, targetId);
    }
  });
}

function reorderShots(draggedId, targetId) {
  const shots = getSortedShots();
  const draggedIdx = shots.findIndex(s => s.id === draggedId);
  const targetIdx = shots.findIndex(s => s.id === targetId);
  if (draggedIdx < 0 || targetIdx < 0) return;
  const [dragged] = shots.splice(draggedIdx, 1);
  shots.splice(targetIdx, 0, dragged);
  const updates = {};
  shots.forEach((s, idx) => {
    updates[`/projects/${currentProjectId}/shots/${s.id}/order`] = idx;
  });
  updates[`/projects/${currentProjectId}/updatedAt`] = Date.now();
  db.ref().update(updates);
}

function formatDuration(seconds) {
  if (!seconds || isNaN(seconds)) return '';
  const m = Math.floor(seconds / 60);
  const s = Math.round(seconds % 60);
  return `${m}:${String(s).padStart(2,'0')}`;
}

// ========== Reels 模式 ==========
function renderReels() {
  const p = projects[currentProjectId];
  const shots = getSortedShots();

  if (shots.length === 0) {
    $('shotContent').innerHTML = `
      <div class="empty-state">
        <h3>這個專案還沒有任何分鏡</h3>
        <p>切換到「分鏡表」模式新增第一個分鏡</p>
      </div>`;
    return;
  }

  if (currentReelIndex >= shots.length) currentReelIndex = 0;
  const cur = shots[currentReelIndex];
  const prev = currentReelIndex > 0 ? shots[currentReelIndex - 1] : null;
  const next = currentReelIndex < shots.length - 1 ? shots[currentReelIndex + 1] : null;
  const ratioCss = ratioToCss(p.ratio);

  let mainMediaHtml = '';
  if (cur.mediaUrl) {
    if (cur.mediaType === 'video') {
      mainMediaHtml = `<video src="${escapeHtml(cur.mediaUrl)}" controls playsinline></video>`;
    } else {
      mainMediaHtml = `<img src="${escapeHtml(cur.mediaUrl)}" alt="">`;
    }
  } else {
    mainMediaHtml = `<div class="reels-empty">尚未上傳影片或圖片</div>`;
  }

  function sideThumb(s, idx) {
    if (!s) return '<div class="reels-side" style="visibility:hidden;"></div>';
    let inner = '';
    if (s.mediaUrl) {
      if (s.mediaType === 'video') {
        inner = `<video src="${escapeHtml(s.mediaUrl)}" muted preload="metadata"></video>`;
      } else {
        inner = `<img src="${escapeHtml(s.mediaUrl)}" alt="">`;
      }
    } else {
      inner = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b4b2a9" stroke-width="1.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;
    }
    return `
      <div class="reels-side" data-reel-jump="${idx}">
        <div class="thumb" style="aspect-ratio: ${ratioCss};">${inner}</div>
        <div class="label-num">#${String(idx + 1).padStart(2, '0')}</div>
      </div>`;
  }

  const num = String(currentReelIndex + 1).padStart(2, '0');
  const total = shots.length;
  const statusClass = 'status-' + (cur.status || 'todo');

  let progressHtml = '<div class="reels-progress">';
  shots.forEach((_, i) => {
    progressHtml += `<div class="dot ${i === currentReelIndex ? 'active' : ''}" data-reel-jump="${i}"></div>`;
  });
  progressHtml += '</div>';

  $('shotContent').innerHTML = `
    <div class="reels-stage">
      ${sideThumb(prev, currentReelIndex - 1)}
      <div class="reels-main">
        <div class="reels-frame">
          <div class="reels-screen" style="aspect-ratio: ${ratioCss};">
            ${mainMediaHtml}
            <div class="reels-overlay">
              <div class="reels-top">
                <span class="reels-pill">#${num} / ${total}</span>
                <span class="reels-pill">${statusLabel(cur.status)}</span>
              </div>
              <div class="reels-bottom">
                <div class="reels-bottom-text">
                  <div class="t-title">${escapeHtml(cur.title || '(未命名分鏡)')}</div>
                  ${cur.note ? `<div class="t-note">${escapeHtml(cur.note)}</div>` : ''}
                </div>
              </div>
            </div>
          </div>
        </div>
        ${progressHtml}
      </div>
      ${sideThumb(next, currentReelIndex + 1)}
    </div>

    <div class="reels-info">
      <div class="info-head">
        <span class="info-title">分鏡 #${num}：${escapeHtml(cur.title || '(未命名分鏡)')}</span>
        <span class="shot-status ${statusClass}">${statusLabel(cur.status)}</span>
      </div>
      ${cur.note ? `<div class="info-note">${escapeHtml(cur.note)}</div>` : '<div class="info-note" style="color:#b4b2a9;">（無補充文字）</div>'}
      <div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn" id="reelsPrevBtn" ${currentReelIndex - 1 < 0 ? 'disabled' : ''}>← 上一個</button>
        <button class="btn" id="reelsNextBtn" ${currentReelIndex + 1 >= total ? 'disabled' : ''}>下一個 →</button>
        ${isReadonly ? '' : '<button class="btn btn-primary" id="reelsEditBtn">編輯這個分鏡</button>'}
      </div>
    </div>
  `;

  attachReelsEvents();
}

function attachReelsEvents() {
  document.querySelectorAll('[data-reel-jump]').forEach(el => {
    el.addEventListener('click', () => {
      currentReelIndex = parseInt(el.dataset.reelJump);
      renderReels();
    });
  });
  const prevBtn = $('reelsPrevBtn');
  const nextBtn = $('reelsNextBtn');
  const editBtn = $('reelsEditBtn');
  if (prevBtn) prevBtn.addEventListener('click', () => {
    if (currentReelIndex > 0) { currentReelIndex--; renderReels(); }
  });
  if (nextBtn) nextBtn.addEventListener('click', () => {
    const shots = getSortedShots();
    if (currentReelIndex < shots.length - 1) { currentReelIndex++; renderReels(); }
  });
  if (editBtn) editBtn.addEventListener('click', () => {
    const shots = getSortedShots();
    if (shots[currentReelIndex]) openShotModal(shots[currentReelIndex].id);
  });
}

$('fileInput').addEventListener('change', handleFileUpload);

async function handleFileUpload(e) {
  const file = e.target.files[0];
  if (!file) return;

  const isVideo = file.type.startsWith('video/');
  const isImage = file.type.startsWith('image/');

  if (!isVideo && !isImage) {
    showToast('請選擇影片或圖片檔案');
    return;
  }
  if (isVideo && file.size > MAX_VIDEO_SIZE) {
    showToast('影片過大（>100MB），請先壓縮或剪短');
    return;
  }
  if (isImage && file.size > MAX_IMAGE_SIZE) {
    showToast('圖片過大（>10MB），請先壓縮');
    return;
  }

  $('uploadProgress').style.display = 'block';
  $('uploadProgress').textContent = '準備上傳…';

  try {
    let uploadFile = file;

    if (isImage && file.size > 1.5 * 1024 * 1024) {
      $('uploadProgress').textContent = '壓縮圖片中…';
      uploadFile = await compressImage(file);
    }

    let duration = null;
    if (isVideo) duration = await getVideoDuration(file);

    const ext = file.name.split('.').pop().toLowerCase();
    const storagePath = `storyboard/${currentProjectId}/${uid()}.${ext}`;
    const ref = storage.ref(storagePath);
    const task = ref.put(uploadFile);

    task.on('state_changed', (snap) => {
      const pct = (snap.bytesTransferred / snap.totalBytes * 100).toFixed(0);
      $('uploadProgress').textContent = `上傳中… ${pct}%`;
    });

    await task;
    const url = await ref.getDownloadURL();

    if (pendingMediaData && pendingMediaData.storagePath && !pendingMediaData.unchanged) {
      try { await storage.ref(pendingMediaData.storagePath).delete(); } catch (e) {}
    }
    pendingMediaData = {
      mediaUrl: url,
      mediaType: isVideo ? 'video' : 'image',
      storagePath: storagePath,
      duration: duration,
      replacesOldPath: (pendingMediaData && pendingMediaData.unchanged) ? pendingMediaData.storagePath : null
    };

    $('uploadProgress').style.display = 'none';
    showPreview(url, isVideo ? 'video' : 'image');
    showToast('上傳完成');
  } catch (err) {
    $('uploadProgress').style.display = 'none';
    showToast('上傳失敗：' + err.message);
  }

  $('fileInput').value = '';
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 1600;
        let { width, height } = img;
        if (width > maxW) {
          height = height * (maxW / width);
          width = maxW;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => {
          if (blob) resolve(new File([blob], file.name, { type: 'image/jpeg' }));
          else reject(new Error('壓縮失敗'));
        }, 'image/jpeg', 0.85);
      };
      img.onerror = () => reject(new Error('圖片載入失敗'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('讀檔失敗'));
    reader.readAsDataURL(file);
  });
}

function getVideoDuration(file) {
  return new Promise((resolve) => {
    const v = document.createElement('video');
    v.preload = 'metadata';
    v.onloadedmetadata = () => {
      URL.revokeObjectURL(v.src);
      resolve(v.duration);
    };
    v.onerror = () => resolve(null);
    v.src = URL.createObjectURL(file);
  });
}

function showPreview(url, type) {
  $('previewArea').style.display = 'block';
  if (type === 'video') {
    $('previewContent').innerHTML = `<video src="${escapeHtml(url)}" controls playsinline></video>`;
  } else {
    $('previewContent').innerHTML = `<img src="${escapeHtml(url)}" alt="">`;
  }
}

$('previewClearBtn').addEventListener('click', async () => {
  if (pendingMediaData && pendingMediaData.storagePath && !pendingMediaData.unchanged) {
    try { await storage.ref(pendingMediaData.storagePath).delete(); } catch (e) {}
  }
  pendingMediaData = { cleared: true, oldPath: (pendingMediaData && pendingMediaData.unchanged) ? pendingMediaData.storagePath : null };
  $('previewArea').style.display = 'none';
  $('previewContent').innerHTML = '';
});

$('saveShotBtn').addEventListener('click', async () => {
  const title = $('shotTitle').value.trim();
  const note = $('shotNote').value.trim();
  const status = document.querySelector('.status-option.selected').dataset.status;

  if (!title && !note && !pendingMediaData) {
    showToast('至少填寫標題、補充文字或上傳影片');
    return;
  }

  const isEdit = !!editingShotId;
  const shotId = editingShotId || uid();

  let order;
  if (isEdit) {
    order = projects[currentProjectId].shots[shotId].order;
  } else {
    order = getSortedShots().length;
  }

  const data = {
    title: title,
    note: note,
    status: status,
    order: order,
    updatedAt: Date.now(),
    updatedBy: currentMemberId
  };

  if (pendingMediaData) {
    if (pendingMediaData.cleared) {
      data.mediaUrl = null;
      data.mediaType = null;
      data.storagePath = null;
      data.duration = null;
      if (pendingMediaData.oldPath) {
        try { await storage.ref(pendingMediaData.oldPath).delete(); } catch (e) {}
      }
    } else if (pendingMediaData.unchanged) {
      // 不動
    } else {
      data.mediaUrl = pendingMediaData.mediaUrl;
      data.mediaType = pendingMediaData.mediaType;
      data.storagePath = pendingMediaData.storagePath;
      data.duration = pendingMediaData.duration;
      if (pendingMediaData.replacesOldPath) {
        try { await storage.ref(pendingMediaData.replacesOldPath).delete(); } catch (e) {}
      }
    }
  } else if (!isEdit) {
    data.mediaUrl = null;
    data.mediaType = null;
    data.storagePath = null;
    data.duration = null;
  }

  const updates = {};
  if (isEdit) {
    Object.keys(data).forEach(k => {
      updates[`/projects/${currentProjectId}/shots/${shotId}/${k}`] = data[k];
    });
  } else {
    data.createdAt = Date.now();
    data.createdBy = currentMemberId;
    updates[`/projects/${currentProjectId}/shots/${shotId}`] = data;
  }
  updates[`/projects/${currentProjectId}/updatedAt`] = Date.now();

  db.ref().update(updates)
    .then(() => { closeModal('shotModal'); showToast(isEdit ? '已更新分鏡' : '已新增分鏡'); })
    .catch(err => showToast('儲存失敗：' + err.message));
});

$('deleteShotBtn').addEventListener('click', async () => {
  if (!editingShotId) return;
  if (!confirm('確定要刪除這個分鏡嗎？')) return;

  const s = projects[currentProjectId].shots[editingShotId];
  if (s && s.storagePath) {
    try { await storage.ref(s.storagePath).delete(); } catch (e) {}
  }
  const updates = {};
  updates[`/projects/${currentProjectId}/shots/${editingShotId}`] = null;
  updates[`/projects/${currentProjectId}/updatedAt`] = Date.now();
  db.ref().update(updates)
    .then(() => { closeModal('shotModal'); showToast('已刪除分鏡'); })
    .catch(err => showToast('刪除失敗：' + err.message));
});

// ========== Modal 通用 ==========
function closeModal(id) { $(id).classList.remove('show'); }
document.querySelectorAll('[data-close-modal]').forEach(el => {
  el.addEventListener('click', () => closeModal(el.dataset.closeModal));
});
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeModal(overlay.id);
  });
});

// ========== 媒體放大檢視 ==========
function viewMedia(shotId) {
  const s = projects[currentProjectId].shots[shotId];
  if (!s || !s.mediaUrl) return;
  let html = '';
  if (s.mediaType === 'video') {
    html = `<video src="${escapeHtml(s.mediaUrl)}" controls autoplay playsinline style="max-width: 90vw; max-height: 80vh; display: block; border-radius: 12px; background: #000;"></video>`;
  } else {
    html = `<img src="${escapeHtml(s.mediaUrl)}" style="max-width: 90vw; max-height: 80vh; display: block; border-radius: 12px;">`;
  }
  $('viewerContent').innerHTML = html;
  $('viewerModal').classList.add('show');
}

// ========== 管理成員 ==========
function openManageMembersModal() {
  renderMemberList();
  renderColorPalette();
  $('newMemberName').value = '';
  selectedNewMemberColor = pickAvailableColor();
  renderColorPalette();
  $('manageMembersModal').classList.add('show');
}

function pickAvailableColor() {
  const used = new Set(Object.values(members).map(m => m.color));
  const available = MEMBER_COLORS.find(c => !used.has(c.id));
  return available ? available.id : MEMBER_COLORS[0].id;
}

function renderColorPalette() {
  $('colorPalette').innerHTML = MEMBER_COLORS.map(c => `
    <div class="color-swatch ${c.id === selectedNewMemberColor ? 'selected' : ''}"
         style="background:${c.bg};"
         data-color-id="${c.id}"
         title="${c.name}"></div>
  `).join('');

  document.querySelectorAll('.color-swatch').forEach(el => {
    el.addEventListener('click', () => {
      selectedNewMemberColor = el.dataset.colorId;
      renderColorPalette();
    });
  });
}

function renderMemberList() {
  const list = $('memberList');
  const entries = Object.entries(members);

  if (entries.length === 0) {
    list.innerHTML = '<p style="font-size:13px; color:#888780; text-align:center; padding:20px 0;">還沒有成員，請從下方新增</p>';
    return;
  }

  // 統計每個成員建立過的專案數
  const counts = {};
  Object.values(projects).forEach(p => {
    if (p.createdBy) counts[p.createdBy] = (counts[p.createdBy] || 0) + 1;
  });

  list.innerHTML = entries.map(([id, m]) => {
    const isMe = id === currentMemberId;
    const isEditing = editingMemberId === id;
    const c = getColor(m.color);
    const count = counts[id] || 0;

    if (isEditing) {
      return `
        <div class="member-row">
          <div class="avatar avatar-md" style="background:${c.bg}; color:${c.fg};">${escapeHtml(getFirstChar(m.name))}</div>
          <input type="text" class="edit-input" id="editMemberName_${id}" value="${escapeHtml(m.name)}" autofocus>
          <div class="actions">
            <button class="btn btn-sm btn-primary" data-save-member="${id}">儲存</button>
            <button class="btn btn-sm" data-cancel-edit-member="${id}">取消</button>
          </div>
        </div>
      `;
    }

    return `
      <div class="member-row ${isMe ? 'is-current' : ''}">
        <div class="avatar avatar-md" style="background:${c.bg}; color:${c.fg};">${escapeHtml(getFirstChar(m.name))}</div>
        <div class="info">
          <div class="name-text">${escapeHtml(m.name)}${isMe ? ' <span style="font-size:11px; color:#888780; font-weight:400;">(目前你)</span>' : ''}</div>
          <div class="count-text">建立過 ${count} 個專案</div>
        </div>
        <div class="actions">
          <button class="btn btn-sm" data-edit-member="${id}">編輯</button>
          ${isMe ? '' : `<button class="btn btn-sm btn-danger" data-delete-member="${id}">刪除</button>`}
        </div>
      </div>
    `;
  }).join('');

  // 綁定事件
  list.querySelectorAll('[data-edit-member]').forEach(el => {
    el.addEventListener('click', () => {
      editingMemberId = el.dataset.editMember;
      renderMemberList();
    });
  });
  list.querySelectorAll('[data-save-member]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.saveMember;
      const newName = $(`editMemberName_${id}`).value.trim();
      if (!newName) { showToast('名字不能空白'); return; }
      db.ref(`/members/${id}/name`).set(newName).then(() => {
        editingMemberId = null;
        showToast('已更新');
      });
    });
  });
  list.querySelectorAll('[data-cancel-edit-member]').forEach(el => {
    el.addEventListener('click', () => {
      editingMemberId = null;
      renderMemberList();
    });
  });
  list.querySelectorAll('[data-delete-member]').forEach(el => {
    el.addEventListener('click', () => openDeleteMemberModal(el.dataset.deleteMember));
  });
}

$('addMemberBtn').addEventListener('click', () => {
  const name = $('newMemberName').value.trim();
  if (!name) { showToast('請輸入名字'); return; }
  const newId = uid();
  db.ref(`/members/${newId}`).set({
    name: name,
    color: selectedNewMemberColor,
    createdAt: Date.now()
  }).then(() => {
    $('newMemberName').value = '';
    selectedNewMemberColor = pickAvailableColor();
    renderColorPalette();
    showToast('已新增成員');
  }).catch(err => showToast('失敗：' + err.message));
});

// ========== 刪除成員 ==========
function openDeleteMemberModal(memberId) {
  pendingDeleteMemberId = memberId;
  const m = members[memberId];
  if (!m) return;

  // 找他建立過的專案
  const ownedProjects = Object.entries(projects).filter(([_, p]) => p.createdBy === memberId);

  $('deleteMemberSub').textContent = `「${m.name}」建立過 ${ownedProjects.length} 個專案，要怎麼處理？`;

  const otherMembers = Object.entries(members).filter(([id]) => id !== memberId);

  let html = `
    <label style="display:flex; align-items:center; gap:8px; padding:10px; border:1px solid #e8e4dc; border-radius:8px; margin-bottom:8px; cursor:pointer;">
      <input type="radio" name="deleteAction" value="keep" checked>
      <span style="font-size:13px;">保留專案，但顯示為「無製作者」</span>
    </label>
  `;

  if (ownedProjects.length > 0 && otherMembers.length > 0) {
    html += `
      <label style="display:flex; align-items:center; gap:8px; padding:10px; border:1px solid #e8e4dc; border-radius:8px; margin-bottom:8px; cursor:pointer;">
        <input type="radio" name="deleteAction" value="transfer">
        <span style="font-size:13px;">轉移給：</span>
        <select id="transferToMember" style="flex:1; padding:6px 8px; border:1px solid #d3d1c7; border-radius:6px; font-family:inherit; font-size:13px;">
          ${otherMembers.map(([id, mm]) => `<option value="${id}">${escapeHtml(mm.name)}</option>`).join('')}
        </select>
      </label>
    `;
  }

  $('deleteMemberOptions').innerHTML = html;
  $('deleteMemberModal').classList.add('show');
}

$('confirmDeleteMemberBtn').addEventListener('click', async () => {
  if (!pendingDeleteMemberId) return;
  const action = document.querySelector('input[name="deleteAction"]:checked').value;
  const updates = {};

  // 找出他建立的所有專案
  const ownedProjectIds = Object.entries(projects)
    .filter(([_, p]) => p.createdBy === pendingDeleteMemberId)
    .map(([id]) => id);

  if (action === 'transfer') {
    const targetId = $('transferToMember').value;
    ownedProjectIds.forEach(pid => {
      updates[`/projects/${pid}/createdBy`] = targetId;
    });
  } else {
    // keep：把 createdBy 設為 null
    ownedProjectIds.forEach(pid => {
      updates[`/projects/${pid}/createdBy`] = null;
    });
  }

  // 刪除成員
  updates[`/members/${pendingDeleteMemberId}`] = null;

  try {
    await db.ref().update(updates);
    pendingDeleteMemberId = null;
    closeModal('deleteMemberModal');
    showToast('已刪除成員');
  } catch (err) {
    showToast('失敗：' + err.message);
  }
});

// ========== 啟動 ==========
init();
</script>
</body>
</html>
